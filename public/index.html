<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json は、Web アプリがモバイル端末やデスクトップにインストールされるときに使われるメタデータを提供します。
      詳細: https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      上のタグでは %PUBLIC_URL% を使っています。
      ビルド時に `public` フォルダーの URL に置き換えられます。
      HTML から参照できるのは `public` フォルダー内のファイルだけです。

      "/favicon.ico" や "favicon.ico" と異なり、"%PUBLIC_URL%/favicon.ico" は
      クライアント側ルーティングとルート以外の公開 URL の両方で正しく動作します。
      ルート以外の公開 URL の設定方法は `npm run build` で確認できます。
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      この HTML ファイルはテンプレートです。
      ブラウザで直接開くと空のページが表示されます。

      このファイルには Web フォント、メタタグ、分析タグなどを追加できます。
      ビルド時にバンドルされたスクリプトが <body> タグ内へ配置されます。

      開発を始めるには `npm start` または `yarn start` を実行します。
      本番用バンドルを作成するには `npm run build` または `yarn build` を実行します。
    -->
  </body>
</html>
